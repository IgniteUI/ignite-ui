# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master, '[0-9]+.[0-9]' ]
  pull_request:
    branches: [ master, '[0-9]+.[0-9]' ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm run cover

    - name: Publish to coveralls.io
      if: github.repository == 'IgniteUI/ignite-ui' && matrix.node-version == '20.x'
      uses: coverallsapp/github-action@v2.3.8
      with:
          path-to-lcov: ./coverage/lcov.info
          github-token: ${{ github.token }}

  # The build job tests the jQuery version in package-lock.json (3.x).
  # This job runs the same tests on jQuery 4.1.
  test-jquery-4:
    name: Test on jQuery 4.1

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 20.x
      uses: actions/setup-node@v7
      with:
        node-version: 20.x
        cache: 'npm'
    - run: npm ci
    - name: Install jQuery 4.1
      run: |
        npm install --no-save jquery@4.1
        npm ls jquery
    # Skips the igZoombar tests: the charts scripts they load from the CDN
    # call $.type, which jQuery 4 removed. Remove the --testPath argument
    # once the charts package no longer calls it.
    - run: npx karma start --single-run --testPath 'unit/!(zoombar)/**'

